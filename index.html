<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Kátia</title>
<!--
  OVERLAY "KÁTIA" — estilo Scarlet Witch — 1080 x 1920 (9:16)
  ------------------------------------------------------------
  OBS / Streamlabs: Fonte "Navegador" (Browser Source)
    - Marque "Arquivo local" e escolha este arquivo
    - Largura 1080, Altura 1920, FPS 60 (ou 30)
    - Coloque a fonte ACIMA da câmera na cena
  Dentro do OBS o fundo fica transparente automaticamente.
  Aberto no navegador comum, mostra uma prévia com fundo escuro.

  Parâmetros opcionais (no fim do endereço):
    ?nome=Kátia          troca o nome
    &sub=AO%20VIVO       texto pequeno embaixo do nome
    &vinheta=0           desliga o escurecimento vermelho das bordas
    &transparente        força fundo transparente fora do OBS
  Tecla B = explosão de magia | Tecla G = falha (glitch) no nome
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent}
  body.preview{background:#050203}

  #stage{
    position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;
    transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;
    font-family:'Cinzel Decorative','Cinzel',Georgia,serif;
  }
  .layer{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}

  /* ---------- prévia (só fora do OBS) ---------- */
  #previewBg{display:none;background:radial-gradient(ellipse at 50% 55%,#3b3337 0%,#1d171a 55%,#0b0809 100%)}
  body.preview #previewBg{display:block}
  #hint{
    position:fixed;left:12px;top:12px;z-index:50;padding:8px 12px;border-radius:8px;
    font:13px/1.4 system-ui,sans-serif;color:#ffd9dc;background:rgba(40,0,8,.85);
    border:1px solid rgba(255,40,60,.5);transition:opacity 1s;display:none
  }
  body.preview #hint{display:block}

  /* ---------- vinheta vermelha ---------- */
  #vignette{
    background:
      linear-gradient(180deg,rgba(14,0,3,.92) 0px,rgba(40,0,8,.55) 300px,rgba(40,0,8,0) 560px),
      linear-gradient(0deg,rgba(14,0,3,.75) 0px,rgba(40,0,8,0) 380px),
      radial-gradient(ellipse 75% 60% at 50% 52%,rgba(0,0,0,0) 60%,rgba(70,0,12,.45) 85%,rgba(20,0,4,.82) 100%);
    opacity:0
  }
  .ready #vignette{animation:fadeIn 1.4s ease-out both,vigPulse 7s ease-in-out 1.4s infinite}
  body.novig #vignette{display:none}

  /* ---------- círculos mágicos ---------- */
  .sigwrap{position:absolute;opacity:0;transform:translate(-50%,-50%)}
  .ready .sigwrap{animation:sigIn 2.6s cubic-bezier(.16,.84,.3,1) var(--d) both}
  .sig{display:block;overflow:visible;animation:sigBreath 5s ease-in-out infinite;
    filter:drop-shadow(0 0 5px rgba(255,25,45,.95)) drop-shadow(0 0 16px rgba(190,0,25,.65))}
  .sig circle,.sig path{fill:none;stroke:#ff2a3a;stroke-linecap:round;stroke-linejoin:round}
  .sig .gB path,.sig .gB circle{stroke:#d1001f}
  .sig .fillc{fill:#ff2a3a;stroke:none}
  .sig .rr{transition:stroke .5s ease}
  .sig .rr.flare{stroke:#fff0f2}

  /* ---------- moldura ---------- */
  #frame{filter:drop-shadow(0 0 4px rgba(255,20,40,.85)) drop-shadow(0 0 12px rgba(180,0,25,.5))}
  #frame path,#frame circle{fill:none}
  .fr-outer{stroke:#8a0016;stroke-width:3}
  .fr-inner{stroke:#ff2a3a;stroke-width:1.6;opacity:.8}
  .fr-draw{stroke-dasharray:1000;stroke-dashoffset:1000}
  .ready .fr-draw{animation:draw 2.6s cubic-bezier(.6,0,.2,1) .2s both}
  #frame .o1{stroke:#ff2a3a;stroke-width:3.5}
  #frame .o2{stroke:#ff3b4a;stroke-width:2}
  #frame .o3{stroke:#ff2a3a;stroke-width:1.4;opacity:.85}
  #frame .o4{fill:#ff2a3a;stroke:#ffd5d9;stroke-width:1}
  #frame .orn{opacity:0}
  .ready #frame .orn{animation:fadeIn 1.2s ease-out 1.4s both}

  #frameRun path{fill:none;stroke-dasharray:26 474;stroke-linecap:round}
  #frameRun{opacity:0}
  .ready #frameRun{animation:fadeIn 1s ease-out 2.8s both}
  .ready #frameRun path{animation:run 9s linear 2.8s infinite}
  .run1{stroke:#ff1a30;stroke-width:16;opacity:.13}
  .run2{stroke:#ff3a4a;stroke-width:7;opacity:.35}
  .run3{stroke:#ffd6da;stroke-width:2.4}

  /* ---------- runas laterais e faixa inferior ---------- */
  .runecol{position:absolute;overflow:visible;opacity:0;
    filter:drop-shadow(0 0 4px rgba(255,25,45,.95)) drop-shadow(0 0 10px rgba(200,0,30,.6))}
  .ready .runecol{animation:fadeIn 1.4s ease-out 2.4s both}
  .runecol path{fill:none;stroke:#ff3646;stroke-linecap:round;stroke-linejoin:round}
  .runecol .rdot{fill:#a8001d}
  .rn{opacity:.18;animation:runeGlow 4.2s ease-in-out infinite;animation-delay:calc(var(--d) * .38s)}

  #ticker{position:absolute;left:80px;top:1836px;width:920px;height:34px;overflow:hidden;opacity:0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
    filter:drop-shadow(0 0 4px rgba(255,25,45,.9))}
  .ready #ticker{animation:fadeIn 1.5s ease-out 3s both}
  #ticker .track{display:flex;width:max-content;animation:tick 42s linear infinite}
  #ticker svg{display:block;flex:none}
  #ticker path{fill:none;stroke:#ff3a4a;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  #ticker .tdia{fill:#ff2a3a;stroke:none}

  /* ---------- cabeçalho: coroa + nome ---------- */
  .aura{position:absolute;left:170px;top:120px;width:740px;height:440px;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,0,40,.36) 0%,rgba(160,0,20,.16) 42%,rgba(0,0,0,0) 70%)}
  .ready .aura{animation:fadeIn 2s ease-out 1s both,auraPulse 4.5s ease-in-out 3s infinite}

  #tiaraWrap{position:absolute;left:370px;top:84px;width:340px;animation:float 6s ease-in-out infinite}
  #tiaraSurge.surge{animation:tSurge 1.4s ease-out}
  #tiara{display:block;width:340px;height:auto;overflow:visible;
    filter:drop-shadow(0 0 5px rgba(255,30,50,.95)) drop-shadow(0 0 20px rgba(210,0,35,.75))}
  .t-fill{opacity:0}
  .t-sheen{opacity:0}
  .t-line{fill:none;stroke:#ff6c78;stroke-width:2.6;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000}
  .t-det{fill:none;stroke:#ff9aa3;stroke-width:1.6;stroke-linecap:round;opacity:0}
  .t-gem{fill:#d4001f;stroke:#ffe0e3;stroke-width:1.4;opacity:0}
  .ready .t-line{animation:draw 1.6s cubic-bezier(.6,0,.3,1) .5s both}
  .ready .t-fill{animation:fadeIn 1s ease-out 1.5s both}
  .ready .t-sheen{animation:fadeIn 1s ease-out 2s both}
  .ready .t-det{animation:fadeIn 1s ease-out 1.9s both}
  .ready .t-gem{animation:fadeIn .6s ease-out 2.1s both,gemPulse 2.8s ease-in-out 2.7s infinite}

  .name{position:absolute;left:0;top:196px;width:1080px;text-align:center;
    font-weight:700;font-size:170px;line-height:1;white-space:nowrap;transform-origin:50% 55%}
  .nameIn{display:inline-block}
  .name.surge{animation:surge 1.4s ease-out}
  .l{display:inline-block;animation:float 5s ease-in-out infinite;animation-delay:calc(var(--i) * -.75s)}
  .li{display:inline-block;opacity:0}
  .ready .li{animation:letterIn 1.2s cubic-bezier(.16,.9,.3,1) both;animation-delay:calc(1s + var(--i) * .16s)}
  .lx{display:inline-block;position:relative;margin:0 -.045em}
  .g,.f,.lx::after{padding:.24em .06em .14em}
  .g{position:absolute;left:0;top:0;color:#ff1a30;
    text-shadow:0 0 12px rgba(255,20,40,.95),0 0 34px rgba(255,0,30,.75),0 0 72px rgba(180,0,20,.65);
    animation:breathe 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.5s)}
  .f{position:relative;display:inline-block;color:transparent;-webkit-text-fill-color:transparent;
    background:
      linear-gradient(100deg,rgba(255,220,225,0) 40%,rgba(255,236,238,.95) 50%,rgba(255,220,225,0) 60%),
      linear-gradient(180deg,#ff7a83 0%,#ff2238 34%,#b3001c 62%,#5c000c 80%,#d10a26 100%);
    background-size:300% 100%,100% 100%;background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-stroke:1.2px rgba(40,0,8,.6);
    animation:shimmer 6.5s linear infinite;animation-delay:calc(var(--i) * .14s)}
  .lx.glitch{animation:glitch .5s steps(1) both}
  .lx.glitch .g{opacity:1 !important}
  .lx.glitch::after{content:attr(data-c);position:absolute;left:0;top:0;color:#ff0a3c;opacity:.85;
    mix-blend-mode:screen;animation:echo .5s steps(1) both}

  .divider{position:absolute;left:180px;top:404px;width:720px;height:60px;overflow:visible;opacity:0;
    filter:drop-shadow(0 0 4px rgba(255,25,45,.95)) drop-shadow(0 0 12px rgba(200,0,30,.6))}
  .ready .divider{animation:divIn 1.3s cubic-bezier(.2,.8,.2,1) 1.9s both}
  .divider .dgem{animation:gemPulse 2.8s ease-in-out infinite}

  .sub{position:absolute;left:0;top:470px;width:1080px;text-align:center;font-family:'Cinzel',Georgia,serif;
    font-weight:500;font-size:30px;letter-spacing:.55em;padding-left:.55em;color:#ffb8bf;opacity:0;
    text-shadow:0 0 8px rgba(255,0,40,.95),0 0 22px rgba(200,0,30,.7)}
  .ready .sub{animation:fadeIn 1.2s ease-out 2.4s both}

  /* ---------- keyframes ---------- */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes vigPulse{0%,100%{opacity:1}50%{opacity:.82}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
  @keyframes tick{to{transform:translateX(-50%)}}
  @keyframes runeGlow{0%,100%{opacity:.18}45%{opacity:1}}
  @keyframes sigIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-140deg)}
    100%{opacity:var(--o);transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  }
  @keyframes sigBreath{0%,100%{opacity:.78}50%{opacity:1}}
  @keyframes auraPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes shimmer{from{background-position:100% 0,0 0}to{background-position:0% 0,0 0}}
  @keyframes gemPulse{0%,100%{fill:#b8001b}50%{fill:#ff5a68}}
  @keyframes divIn{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
  @keyframes letterIn{
    0%{opacity:0;transform:translateY(40px) scale(1.7);filter:blur(16px) brightness(3)}
    45%{opacity:1;filter:blur(3px) brightness(2.2)}
    100%{opacity:1;transform:none;filter:none}
  }
  @keyframes surge{
    0%{filter:brightness(1);transform:scale(1)}
    12%{filter:brightness(2.2) saturate(1.4);transform:scale(1.06)}
    100%{filter:brightness(1);transform:scale(1)}
  }
  @keyframes tSurge{0%{filter:brightness(1)}12%{filter:brightness(2.2)}100%{filter:brightness(1)}}
  @keyframes glitch{
    0%{transform:translate(0,0)}
    10%{transform:translate(-6px,2px) skewX(-10deg)}
    20%{transform:translate(5px,-3px) skewX(8deg)}
    35%{transform:translate(-3px,1px) scale(1.06)}
    50%{transform:translate(4px,0) skewX(-4deg)}
    65%{transform:translate(-2px,-2px)}
    80%{transform:translate(1px,1px)}
    100%{transform:none}
  }
  @keyframes echo{
    0%{transform:translate(10px,0);clip-path:inset(20% 0 55% 0)}
    25%{transform:translate(-12px,0);clip-path:inset(55% 0 15% 0)}
    50%{transform:translate(8px,0);clip-path:inset(35% 0 40% 0)}
    75%{transform:translate(-6px,0);clip-path:inset(65% 0 5% 0)}
    100%{transform:none;clip-path:inset(0 0 100% 0)}
  }
</style>
</head>

<script>
(() => {
  const W = 1080, H = 1920, TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const qs = new URLSearchParams(location.search);
  const NAME = (qs.get('nome') || 'Kátia').normalize('NFC');
  const SUB = qs.get('sub') || '';
  const transparent = !!window.obsstudio || qs.has('transparente');
  if (!transparent) document.body.classList.add('preview');
  if (qs.get('vinheta') === '0') document.body.classList.add('novig');

  const stage = document.getElementById('stage');
  const nameEl = document.getElementById('name');
  const nameIn = document.getElementById('nameIn');
  const tiaraSurge = document.getElementById('tiaraSurge');

  /* ---------------- Runas (Futhark antigo + sigilos de bruxa), caixa 10x16 ---------------- */
  const RUNES = [
    [[[2,0],[2,16]],[[2,5],[8,1]],[[2,10],[8,6]]],
    [[[2,16],[2,0],[8,5],[8,16]]],
    [[[2,0],[2,16]],[[2,4],[8,8],[2,12]]],
    [[[2,0],[2,16]],[[2,1],[8,5]],[[2,6],[8,10]]],
    [[[2,16],[2,0],[8,4],[2,8],[8,16]]],
    [[[8,1],[2,8],[8,15]]],

    const mult = 1 + sigBoost * 7;
    for (const s of sigils) {
      for (let i = 0; i < s.groups.length; i++) {
        s.ang[i] = (s.ang[i] + s.speeds[i] * mult * dt / 1000) % 360;
        s.groups[i].setAttribute('transform', `rotate(${s.ang[i].toFixed(2)})`);
      }
    }
    drawBack(k, ramp);
    drawWisps(k, ramp);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------------- Início (espera a fonte carregar) ---------------- */
  let started = false;
  function start() {
    if (started) return; started = true;
    fitName(); measure();
    document.body.classList.add('ready');
    readyT = T;
    setTimeout(measure, 3000);
    setTimeout(loopBurst, 2700);
    setTimeout(loopGlitch, 5000);
    const hint = document.getElementById('hint');
    setTimeout(() => { hint.style.opacity = '0'; }, 9000);
  }
  const fontsP = (document.fonts && document.fonts.load)
    ? Promise.all([document.fonts.load('700 170px "Cinzel Decorative"', NAME), document.fonts.load('500 30px "Cinzel"')])
    : Promise.resolve();
  Promise.race([fontsP, new Promise(r => setTimeout(r, 3000))]).catch(() => {}).then(start);
})();
</script>
