# =====================================================================
#  Servidor de Fotografia (FiveM) — sem RP, só fotos
#  Guia completo no LEIAME.md desta pasta.
# =====================================================================

# Porta do servidor (libere 30120 TCP e UDP no roteador para os amigos entrarem)
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Recursos básicos do FiveM (o instalador baixa do cfx-server-data)
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure rconlog

# O modo de jogo de fotografia
ensure fotografia

# Nome e descrição na lista de servidores
sv_hostname "Estúdio de Fotografia | sem RP, só fotos"
sets sv_projectName "Estúdio de Fotografia"
sets sv_projectDesc "Câmera livre com foco, filtros, luzes de estúdio, poses, clima e carros. Sem RP."
sets tags "fotografia, photography, photo mode, screenshots, sem rp"
sets locale "pt-BR"

# Para NÃO aparecer na lista pública de servidores, tire o # da linha abaixo
#sv_master1 ""

# Quantas pessoas ao mesmo tempo (a chave grátis permite até 48)
sv_maxclients 16

# OneSync: necessário para o clima/hora sincronizados e para ir até outros jogadores
set onesync on

# Versão do GTA usada no servidor (carros e roupas até a DLC Bottom Dollar Bounties)
set sv_enforceGameBuild 3258

sv_scriptHookAllowed 0
sv_endpointprivacy true
set steam_webApiKey "none"

# Admins: podem remover qualquer local salvo e mudar o clima mesmo se
# Config.Ambiente.SoAdminPodeMudar = true. Troque pelo seu identificador
# (o console mostra "identificador: license:..." quando você entra) e tire o #.
add_ace group.admin fotografia.admin allow
add_ace group.admin command allow
#add_principal identifier.license:COLE_AQUI group.admin

# Sua chave do servidor fica em chave.cfg (crie a partir de chave.cfg.exemplo)
exec chave.cfg
